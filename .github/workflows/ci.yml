name: SupportPulse synthetic validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t supportpulse-synthetic-ci .
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportpulse_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: supportpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportpulse_test -d supportpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://supportpulse_test:isolated-ci-password@127.0.0.1:5432/supportpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_postgres.py
