# Grafana-managed rule provisioned only in the optional alert drill overlay.
# Prometheus datasource UID "prometheus" is bundled with Grafana otel-lgtm.
# Metric labels are static route/method/status-class, not customer identifiers.
apiVersion: 1
groups:
  - orgId: 1
    name: supportpulse_critical_workflows
    folder: SupportPulse AI
    interval: 10s
    rules:
      - uid: sp_overview_5xx_v1
        title: "SupportPulse: critical overview returns HTTP 5xx"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum(increase(supportpulse_http_requests_total{http_route="/api/v1/overview",http_request_method="GET",http_response_status_class="5xx"}[2m])) or vector(0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: reduce
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          project: supportpulse-ai
          stage: synthetic-only
          user_impact: critical-overview-read
          severity: warning
        annotations:
          summary: "Synthetic SupportPulse overview has returned HTTP 5xx in last 2 minutes"
          description: "User-facing overview failure detected. Drill uses opt-in header; ordinary users were not affected."
          runbook_url: "https://github.com/butomaya12-wq/supportpulse-ai/blob/main/docs/ALERT_DRILL_RUNBOOK.md"
        isPaused: false
